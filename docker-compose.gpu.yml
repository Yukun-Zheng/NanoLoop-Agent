services:
  api:
    build:
      args:
        API_EXTRAS: "${NANOLOOP_API_EXTRAS:-models}"
        PYTORCH_INDEX_URL: "${PYTORCH_GPU_INDEX_URL:-https://download.pytorch.org/whl/cu126}"
    environment:
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
