schema_version: "1"
stage: F
model_id: msbi-instance-balanced-v1
model:
  encoder: convnext_tiny
  encoder_pretrained: true
  freeze_encoder: false
  fpn_channels: 64
  fusion_mode: gate
  enable_sdf: true
data:
  manifest_root: ${NANOLOOP_MSBI_MANIFEST_ROOT}
  patch_size: 512
  train_samples_per_epoch: 768
  validation_samples_per_epoch: 192
  density_sampling_probability: 0.70
  preload_records: true
  morphology_balanced_sampling: true
loss:
  weights:
    foreground: 1.20
    center: 1.0
    boundary: 1.25
    contour: 0.50
    sdf: 0.20
    gate: 0.10
    distill: 0.20
    consistency: 0.0
training:
  seed: 2026
  epochs: 20
  batch_size: 2
  gradient_accumulation_steps: 4
  num_workers: 4
  encoder_learning_rate: 0.000002
  head_learning_rate: 0.00005
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  ema_decay: 0.998
  warmup_epochs: 2
  warmup_start_factor: 0.1
  early_stopping_patience: 6
  output_root: ${NANOLOOP_MSBI_OUTPUT_ROOT}/stage-f
