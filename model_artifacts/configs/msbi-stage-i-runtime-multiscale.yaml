schema_version: "1"
loader: torchscript
architecture: nanoloop-msbi-efficient-anchor-v1
input_channels: 1
input_size: [256, 256]
patch_size: [1406, 2048]
stride: [1406, 2048]
tile_batch_size: 1
inference_amp: false
inference_amp_dtype: bfloat16
fusion_accumulator_dtype: float32
tiling_padding: reflect
overlap_fusion: uniform
bottom_crop_px: 130
normalization: fixed
pixel_scale: 255.0
anchor_multiscale_blend:
  enabled: true
  tiled_weight: 0.80
  full_frame_weight: 0.20
  patch_size: [256, 256]
  stride: [128, 128]
  tile_batch_size: 64
  overlap_fusion: uniform
  fusion_accumulator_dtype: float32
  gpu_fusion: true
save_raw_heads: false
save_auxiliary_previews: false
compact_instance_artifact: true
save_adapter_instance_json: false
profile_timings: true
runtime_compact_forward: true
compact_uncertainty_stride: 4
compress_instance_artifact: false
output_names:
  - foreground_logits
  - center_logits
  - boundary_logits
  - distance_field
  - small_logits
  - large_logits
  - gate_logits
decoder:
  mode: connected_components
  foreground_threshold: 0.275
  center_threshold: 0.50
  center_nms_radius: 13
  boundary_threshold: 0.50
  boundary_penalty: 2.0
  min_area_px: 128
  max_area_px: null
  watershed_compactness: 0.0
  exclude_border: false
  connectivity: 2
  fallback_peak_source: sdf
scientific_status:
  training_complete: true
  runtime_verified: true
  acceptance: passed_strict_validation_superiority_gate
  independent_test: evaluated_not_strictly_superior_to_all_baselines
  ready_recommendation: false
